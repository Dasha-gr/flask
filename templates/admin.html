<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление услугами</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="admin-wrapper" style="align-items: flex-start; padding-top: 30px;">
        <div class="admin-card" style="max-width: 800px;">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0;">⚙️ Управление услугами</h3>
                <div style="font-size: 14px; color: #888;">
                    Привет, <b>{{ session.admin_name }}</b> |
                    <a href="/logout" style="color: #dc3545; text-decoration: none; font-weight: bold;">Выйти</a>
                </div>
            </div>

            <form method="POST" action="/admin_panel" style="margin-bottom: 30px; background: #f7f8ff; padding: 20px; border-radius: 10px;">
                <h4 style="margin-bottom: 15px; color: #2c2f4a;">Добавить новую услугу</h4>
                <input type="text" name="title" placeholder="Название услуги" required>
                <textarea name="description" placeholder="Описание услуги" style="min-height: 80px;"></textarea>
                <input type="text" name="price" placeholder="Цена (например: от 30 000 ₽)">
                <button type="submit" style="width: 100%; margin-top: 10px;">➕ Добавить услугу</button>
            </form>

            <h4 style="margin-bottom: 15px; color: #2c2f4a;">Список услуг на сайте</h4>
            <table style="width: 100%; border-collapse: collapse;">
                <tr style="background: #f4f4f4;">
                    <th>Название и описание</th>
                    <th style="width: 140px;">Цена</th>
                    <th style="width: 100px;">Действия</th>
                </tr>
                {% for s in items %}
                <tr style="border-bottom: 1px solid #ddd;">
                    <td>
                        <form method="POST" action="{{ url_for('update_service', item_id=s[0]) }}" id="form-{{ s[0] }}">
                            <input type="text" name="title" value="{{ s[1] }}" required
                                   style="width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 4px; box-sizing: border-box;">
                            <textarea name="description"
                                      style="width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; min-height: 50px; box-sizing: border-box;">{{ s[2] or '' }}</textarea>
                        </form>
                    </td>
                    <td>
                        <input type="text" name="price" value="{{ s[3] or '' }}" form="form-{{ s[0] }}"
                               style="width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                    </td>
                    <td>
                        <div style="display: flex; gap: 6px;">
                            <button type="submit" form="form-{{ s[0] }}"
                                    style="background: #667eea; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;">
                                💾
                            </button>
                            <form action="{{ url_for('delete_service', item_id=s[0]) }}" method="post"
                                  onsubmit="return confirm('Удалить услугу «{{ s[1] }}»?');"
                                  style="margin: 0;">
                                <button type="submit" style="background: #dc3545; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;">
                                    🗑
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" style="text-align:center; color:#999; padding:20px;">Услуг пока нет.</td>
                </tr>
                {% endfor %}
            </table>

        </div>
    </div>
</body>
</html>
